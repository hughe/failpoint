[package]
name = "failpoint"
version = "3.0.0"
edition = "2021"
authors = ["Hugh Emberson <hugh_emberson@gmail.com>"]
description = "Simple fault injection"
license = "MIT OR Apache-2.0"

[lib]
name = "failpoint"

[features]
default = ["failpoint_enabled"]
failpoint_enabled = []

[dependencies]

[dev-dependencies]
anyhow = "1.0.99"
thiserror = "2.0.17"
# Declared as a git dependency, NOT a path dependency, and that is
# load-bearing: this crate is exported to the public hughe/failpoint
# mirror, where no sibling checkout exists and a path dependency makes
# `cargo build` fail before compiling anything. In the sldbmono monorepo
# the root .cargo/config.toml patches this back to the tree next door,
# so local edits are still picked up without a commit-and-push round
# trip. Changing this to a path dependency breaks the public mirror --
# it has been done twice now.
test_log_collector = { git = "https://github.com/hughe/test_log_collector", version = "1.0.0" }
